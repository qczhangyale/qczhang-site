<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Cream background matching the site's warm theme -->
  <rect width="1200" height="630" fill="#faf5ea"/>

  <!-- Subtle blueprint-grid in a corner, matching the homepage hero pattern feel -->
  <g opacity="0.06" stroke="#1a365d" stroke-width="1">
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="800" y1="80" x2="1200" y2="80"/>
    <line x1="800" y1="160" x2="1200" y2="160"/>
    <line x1="800" y1="240" x2="1200" y2="240"/>
    <line x1="800" y1="320" x2="1200" y2="320"/>
    <line x1="800" y1="400" x2="1200" y2="400"/>
    <line x1="800" y1="480" x2="1200" y2="480"/>
    <line x1="800" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600"
        fill="#1a365d" letter-spacing="6">— A RESEARCH PROGRAM</text>

  <!-- Big serif headline -->
  <text x="80" y="240" font-family="'Times New Roman', Georgia, serif" font-size="92" font-weight="700"
        fill="#2a1f10" letter-spacing="-2">Q.C. Zhang</text>

  <!-- Subtitle (program name) -->
  <text x="80" y="310" font-family="'Times New Roman', Georgia, serif" font-size="38" font-weight="500"
        fill="#6b5840">Twistor Configuration Geometry</text>
  <text x="80" y="360" font-family="'Times New Roman', Georgia, serif" font-size="38" font-weight="500"
        fill="#6b5840">
    <tspan font-style="italic" fill="#1a365d">&amp;</tspan>
    <tspan> the Configurable Universe</tspan>
  </text>

  <!-- Tagline as a description-style serif italic -->
  <text x="80" y="450" font-family="'Times New Roman', Georgia, serif" font-size="26" font-style="italic"
        fill="#6b5840">A research program on the dimensionless</text>
  <text x="80" y="488" font-family="'Times New Roman', Georgia, serif" font-size="26" font-style="italic"
        fill="#6b5840">constants of physics as structural invariants.</text>

  <!-- Featured formula box, magazine-cover teaser style -->
  <rect x="80" y="525" width="430" height="62" fill="none" stroke="#1a365d" stroke-width="2" rx="4"/>
  <text x="105" y="567" font-family="'Times New Roman', Georgia, serif" font-style="italic"
        font-size="32" fill="#1a365d">
    α<tspan font-size="22" baseline-shift="sub">G</tspan>
    <tspan> ≈ </tspan>
    α<tspan font-size="22" baseline-shift="super">8</tspan>
    <tspan> y</tspan>
    <tspan font-size="22" baseline-shift="sub">e</tspan>
    <tspan font-size="22" baseline-shift="super">5</tspan>
  </text>

  <!-- Right-side accent: precision callout -->
  <g transform="translate(1000, 480)">
    <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600"
          fill="#1a365d" letter-spacing="3">PRECISION</text>
    <text x="0" y="55" font-family="'Times New Roman', Georgia, serif" font-size="64" font-weight="700"
          fill="#1a365d" letter-spacing="-2">0.024%</text>
  </g>

  <!-- Bottom-right domain stamp -->
  <text x="1120" y="600" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500"
        fill="#948268" text-anchor="end" letter-spacing="2">qczhang.com</text>
</svg>
